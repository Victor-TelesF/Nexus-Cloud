      <rect x="218" y="282" width="156" height="36" rx="18" fill="#203c55"/>
      <text x="296" y="305">Análise de dados</text>
      <rect x="386" y="282" width="144" height="36" rx="18" fill="#203c55"/>
      <text x="458" y="305">Estudo prático</text>
    </g>
  </g>
