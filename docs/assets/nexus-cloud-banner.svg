<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Nexus Cloud</title>
  <desc id="desc">Laboratório de SQL e análise de dados. Capa em azul escuro com uma ilustração de nuvem conectada a dados.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1224"/>
      <stop offset="1" stop-color="#142e48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#70e4ce"/>
      <stop offset="1" stop-color="#6babf4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#91b5d0" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#background)"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="64" y="66" width="32" height="4" rx="2" fill="#70e4ce"/>
    <text x="110" y="74" fill="#b8d0e4" font-size="14" letter-spacing="3">LABORATÓRIO DE DADOS</text>
    <text x="60" y="174" fill="#f2f7fc" font-size="72" font-weight="700" letter-spacing="-3">Nexus Cloud</text>
    <text x="64" y="224" fill="#b8cce0" font-size="23">Perguntar. Consultar. Compreender.</text>
    <g font-size="14" fill="#d4e6f5" text-anchor="middle">
